server:
  port: ${BACKEND_PORT:8088}
  error:
    include-stacktrace: never
    include-exception: false
    include-message: always

spring:
  application:
    name: bus-ticket-backend

  # ===== MySQL =====
  datasource:
    url: jdbc:mysql://localhost:3308/bus_ticket_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${MYSQL_USER:busticket}
    password: ${MYSQL_PASSWORD:busticket123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ===== Redis =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:redis123}
      timeout: 5000

  # ===== RabbitMQ =====
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:busticket}
    password: ${RABBITMQ_PASSWORD:busticket123}
    virtual-host: /

  # ===== Mail (cấu hình sau) =====
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ===== Firebase =====
firebase:
  config-file: ${FIREBASE_CONFIG_FILE:firebase-service-account.json}

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ===== Logging =====
logging:
  level:
    com.busticket: DEBUG
    org.springframework.data.redis: DEBUG
    org.hibernate.SQL: DEBUG
